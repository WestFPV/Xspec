name = "xspec-flight-lab"
main = "worker.mjs"
compatibility_date = "2026-10-08"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "APP_STATE"
class_name = "AppState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppState"]
